<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的 · 菲比同学</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 头像 / 昵称 / 年级 / 切换学生：内容由 profile.js 渲染 -->
<div class="card" id="profile-card"></div>

<!-- 声音 / 显示 / 减少动画：只保留儿童能看懂的设置 -->
<section class="card">
    <h2 class="ph-section-title">我的设置</h2>
    <div id="profile-settings"></div>
</section>

<div id="profile-status"></div>

<!-- 家长操作：先备份再清空这个小朋友的学习数据（重置前必须二次确认） -->
<section class="card">
    <h2 class="ph-section-title">家长操作</h2>
    <div id="profile-data"></div>
</section>

<!-- 次级入口，不是主行动 -->
<div class="card">
    <p class="ph-row-secondary">
        <a class="ph-btn ph-btn--secondary" href="index.html">自由练习</a>
        <a class="ph-btn ph-btn--ghost" href="today.html">回到今天</a>
    </p>
</div>

<script src="ui-shell.js"></script>
<script src="kid-lang.js"></script>
<script src="ui-components.js"></script>
<script src="profile.js"></script>
<script>
    // 页面初始化：显示设置 → 一级导航 → 渲染个人页
    UIShell.applySettings();
    UIShell.mountNav("profile");
    ProfilePage.init();
</script>
</body>
</html>
