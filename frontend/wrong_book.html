<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的挑战 · 菲比同学</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>⚔️ 我的挑战</h1>

<div class="card">

<p class="diag-intro">把不会的题一道道练会，它就变成你的本领啦～</p>

<div class="row">
    <label>我是
        <select id="student" onchange="onStudentChange()"></select>
    </label>
    <label>科目
        <select id="subject" onchange="onSubjectChange()">
            <option value="">全部</option>
            <option value="数学">数学</option>
            <option value="语文">语文</option>
            <option value="英语">英语</option>
        </select>
    </label>
</div>

<p class="diag-title">挑战状态</p>

<div class="status-picker" id="statuses">
    <button class="status-btn active" data-status="" onclick="selectStatus('')">全部</button>
    <button class="status-btn" data-status="NEW" onclick="selectStatus('NEW')">🔴 待攻克</button>
    <button class="status-btn" data-status="LEARNING" onclick="selectStatus('LEARNING')">🟡 训练中</button>
    <button class="status-btn" data-status="MASTERED" onclick="selectStatus('MASTERED')">🟢 已攻克</button>
</div>

<div id="stats" class="stat-cards"></div>

<div id="list"></div>

<div id="hint" class="meta"></div>

<p class="meta link-row">
    <a href="index.html">← 回到日常练习</a>
    <a href="diagnostic.html">🧪 能力诊断</a>
    <a href="knowledge_map.html">🗺 我的成长</a>
    <a href="study_advice.html">💡 学习建议</a>
</p>

</div>

<script src="phoebe.js"></script>
<script src="phoebe3d.js"></script>
<script src="ui-shell.js"></script>
<script src="kid-lang.js"></script>
<script src="ui-components.js"></script>
<script src="wrong_book.js"></script>


<script>
  if (window.UIShell) {
    UIShell.applySettings();
    UIShell.mountNav("wrong");
    UIShell.loadStudents().then(function (list) {
      var me = list.filter(function (s) { return String(s.id) === UIShell.getStudentId(); })[0];
      if (me) UIShell.applyAgeMode(me.grade);
    });
  }
</script>
</body>
</html>
