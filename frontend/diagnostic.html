<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>能力诊断 · 菲比同学</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🧪 能力诊断</h1>

<div class="card">

<p class="diag-intro">不用管现在是几年级，做几道题，系统就能找到你的<b>真实水平</b>～</p>

<div class="row">
    <label>我是
        <select id="student" onchange="onStudentChange()"></select>
    </label>
</div>

<p class="diag-title">请选择测试科目</p>

<div class="subject-picker" id="subjects">
    <button class="subject-card active" data-subject="数学" onclick="selectSubject('数学')">🔢 数学</button>
    <button class="subject-card" data-subject="语文" onclick="selectSubject('语文')">📖 语文</button>
    <button class="subject-card" data-subject="英语" onclick="selectSubject('英语')">🔤 英语</button>
</div>

<button id="start-btn" onclick="startDiagnostic()" disabled>开始能力诊断</button>

<div id="profile-box" class="profile-box hidden"></div>

<div id="hint" class="meta"></div>

<p class="meta link-row">
    <a href="diagnostic_report.html" id="report-link">📊 查看能力报告</a>
    <a href="index.html">← 回到日常练习</a>
</p>

</div>

<script src="ui-shell.js"></script>
<script src="kid-lang.js"></script>
<script src="ui-components.js"></script>
<script src="diagnostic.js"></script>


<script>
  if (window.UIShell) { UIShell.applySettings(); }
</script>
</body>
</html>
