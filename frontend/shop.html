<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>积分商城 · 菲比同学</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶部：我是谁 -->
<div class="card">
    <div class="ph-topbar">
        <span class="ph-avatar" aria-hidden="true">🐼</span>
        <div class="ph-who">
            <span class="ph-who-name" id="who-name">小朋友</span>
            <span class="ph-who-grade ph-num" id="who-grade"></span>
        </div>
        <button type="button" class="ph-btn ph-btn--ghost" id="switch-student" onclick="toggleStudentPicker()">切换学生</button>
    </div>
    <div class="ph-students hidden" id="student-picker"></div>

    <h1 class="ph-title">🛍️ 积分商城</h1>
    <p class="ph-lead">学习挣来的积分，在这里看得到、也算得清。</p>
    <p class="ph-greeting" id="phoebe-greeting">🐼 菲比：先看看你现在攒了多少积分～</p>
</div>

<div id="shop-status"></div>
<div id="shop-balance"></div>

<!-- 商品：比例先占位，兑换功能还没实装（只展示） -->
<section class="card">
    <h2 class="ph-section-title">🎁 可以换的东西</h2>
    <div id="shop-goods"></div>
    <p class="points-note" id="shop-note"></p>
</section>

<!-- 积分明细：第一版奖励行为表（后端 points_rewards.REWARDS 是唯一真相） -->
<section class="card">
    <h2 class="ph-section-title">📒 积分明细</h2>
    <p class="ph-lead">哪些学习成果值多少分，一条一条写在这里。</p>
    <div id="shop-rewards"></div>
</section>

<!-- 我的积分流水：GET /api/points/{student_id} 的 records -->
<section class="card">
    <h2 class="ph-section-title">🧾 我的积分流水</h2>
    <div id="shop-records"></div>
</section>

<!-- 想再看一眼（次级入口） -->
<div class="card">
    <h2 class="ph-section-title">想再看一眼</h2>
    <p class="ph-row-secondary">
        <a class="ph-btn ph-btn--secondary" href="challenge.html">⚔️ 我的挑战</a>
        <a class="ph-btn ph-btn--secondary" href="growth.html">🗺 我的成长</a>
        <a class="ph-btn ph-btn--secondary" href="today.html">🏠 回到今天</a>
    </p>
</div>

<script src="ui-shell.js"></script>
<script src="kid-lang.js"></script>
<script src="ui-components.js"></script>
<script src="shop.js"></script>
<script>
    // 页面初始化：显示设置 → 一级导航 → 拉取积分数据
    UIShell.applySettings();
    UIShell.mountNav("shop");
    ShopPage.init();
</script>
</body>
</html>
