<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日完成 · 菲比同学</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

<!-- 顶部：完成结论 + 学习者 -->
<div class="card">
    <div class="ph-topbar">
        <span class="ph-avatar" aria-hidden="true">🐼</span>
        <span class="ph-name" id="who-name">小朋友</span>
        <span class="ph-grade ph-num" id="who-grade"></span>
        <button type="button" class="ph-btn ph-btn--ghost" id="switch-student"
                onclick="toggleStudentPicker()" aria-expanded="false">切换</button>
    </div>
    <div class="ph-students hidden" id="student-picker"></div>

    <h1 class="ph-title" id="daily-title">🎉 今天完成啦</h1>
    <p class="ph-lead" id="daily-message">正在读取今天的情况…</p>
    <p class="ph-rest" id="daily-rest"></p>

    <div class="row ph-row-secondary">
        <label class="ph-sr-only" for="student">小朋友</label>
        <select id="student"></select>
        <button type="button" id="refresh-btn" class="ph-btn ph-btn--ghost" onclick="loadDaily()">🔄 刷新</button>
        <button type="button" id="start-btn" class="ph-btn ph-btn--secondary" onclick="startDay()">▶️ 开始今天的学习</button>
    </div>
</div>

<!-- 成长反馈：学会了什么（主指标），由 daily.js 渲染 -->
<div id="daily-child"></div>

<!-- 今天的小任务 -->
<div class="card ph-card--task">
    <p class="task-title">今天的小任务</p>
    <p class="meta" id="daily-progress"></p>
    <div id="daily-tasks" class="task-list"></div>
</div>

<!-- 学习目标 -->
<div class="card">
    <p class="task-title">我的学习目标</p>
    <p class="meta" id="daily-goal">还没有生成目标～</p>
</div>

<!-- 家长信息（儿童默认收起） -->
<details class="ph-debug">
    <summary>家长信息（小朋友可以跳过）</summary>
    <p class="meta" id="daily-debug"></p>
</details>

<p class="meta link-row">
    <a href="today.html">🐼 今日学习</a>
    <a href="recall.html">🧠 主动回忆</a>
    <a href="recovery.html">🩺 错题康复</a>
    <a href="habit.html">📅 学习习惯</a>
</p>

</div>

<script src="ui-shell.js"></script>
<script src="kid-lang.js"></script>
<script src="ui-components.js"></script>
<script src="daily.js"></script>


<script>
  if (window.UIShell) {
    UIShell.applySettings();
    UIShell.mountNav("today");
    UIShell.loadStudents().then(function (list) {
      var me = list.filter(function (s) { return String(s.id) === UIShell.getStudentId(); })[0];
      if (me) UIShell.applyAgeMode(me.grade);
    });
  }
</script>
</body>
</html>
