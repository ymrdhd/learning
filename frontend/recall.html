<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>主动回忆 · 菲比同学</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

<h1>🧠 主动回忆</h1>

<div class="card">
    <p class="meta">这里不给你选项：先自己想起来，再把答案写出来～</p>
    <p class="row">
        <label for="student">小朋友：</label>
        <select id="student"></select>
        <label for="subject">练哪一科：</label>
        <select id="subject">
            <option value="">综合</option>
            <option value="数学">数学</option>
            <option value="语文">语文</option>
            <option value="英语">英语</option>
        </select>
        <label for="count">几张卡：</label>
        <select id="count">
            <option value="3">3 张</option>
            <option value="4">4 张</option>
            <option value="5">5 张</option>
        </select>
        <button id="start-btn" class="mode-btn" onclick="startRecall()">开始回忆</button>
    </p>
    <p id="recall-status" class="meta"></p>
</div>

<div class="card" id="recall-card" style="display:none">
    <p class="meta" id="card-meta"></p>
    <p class="task-title" id="card-prompt"></p>
    <p class="recall-hint meta" id="card-hint"></p>
    <p class="row">
        <input id="card-answer" class="recall-answer" type="text" placeholder="把你想起来的写在这里…" autocomplete="off">
    </p>
    <p class="row">
        <button class="mode-btn" onclick="showHint()">💡 想不起来，给点提示</button>
        <button class="mode-btn" onclick="submitRecall()">✅ 提交</button>
        <button class="mode-btn" id="next-btn" style="display:none" onclick="nextCard()">下一张 ➡️</button>
    </p>
    <div id="card-feedback" class="task-summary"></div>
</div>

<div class="card">
    <p class="task-title">今天的小结</p>
    <p id="recall-total" class="task-mix">还没有开始回忆。</p>
    <div id="recall-list" class="task-list"></div>
</div>

<p class="meta link-row">
    <a href="today.html">🐼 今日学习</a>
    <a href="recovery.html">🩺 错题康复</a>
    <a href="daily.html">🎉 今日完成</a>
    <a href="habit.html">📅 学习习惯</a>
</p>

</div>

<script src="ui-shell.js"></script>
<script src="kid-lang.js"></script>
<script src="ui-components.js"></script>
<script src="recall.js"></script>


<script>
  if (window.UIShell) {
    UIShell.applySettings();
    UIShell.mountNav("today");
    UIShell.loadStudents().then(function (list) {
      var me = list.filter(function (s) { return String(s.id) === UIShell.getStudentId(); })[0];
      if (me) UIShell.applyAgeMode(me.grade);
    });
  }
</script>
</body>
</html>
